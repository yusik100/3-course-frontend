<!doctype html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Костанді Ю. А., ІМ-41, Лабораторна робота №5, Варіант - 14</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <form id="infoForm">
        <h2>Форма реєстрації</h2>
        <div class="form-group">
            <label for="pib">ПІБ</label>
            <input type="text" id="pib" name="pib" placeholder="ТТТТТТ Т.Т.">
        </div>
        <div class="form-group">
            <label for="phone">Телефон</label>
            <input type="text" id="phone" name="phone" placeholder="(ЧЧЧ)-ЧЧЧ-ЧЧ-ЧЧ">
        </div>
        <div class="form-group">
            <label for="idcard">ID-card</label>
            <input type="text" id="idcard" name="idcard" placeholder="ТТ №ЧЧЧЧЧЧ">
        </div>
        <div class="form-group">
            <label for="bdate">Дата народження</label>
            <input type="text" id="bdate" name="bdate" placeholder="ЧЧ.ЧЧ.ЧЧЧЧ">
        </div>
        <div class="form-group">
            <label for="email">e-mail</label>
            <input type="text" id="email" name="email" placeholder="тттттт@ттттт.com">
        </div>
        <button type="submit">Надіслати</button>
    </form>
    <script src="script.js"></script>
</body>

</html>
